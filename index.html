<body>
    <!-- NAVBAR -->
    <div class="navBar">
        <div id="navBarLogo">
            <div style="width: 60px; height: 60px; background-color: #8E7DBD; border-radius: 100%;"></div>
            <div id="navBarLogoText">
                <span id="navBarLogoHeader">Timmie</span>
                <span id="navBarLogoSub">the chef</span>
            </div>
        </div>
        <div id="navBarAllRecipes">
            All recipes
        </div>
        <div id="navBarSearchBtn">

        </div>
    </div>


    <!-- SEARCH BAR -->
    <div class="search_bar_background">
        <h1>Search Recipes</h1>
        <div class="search_bar">
            <input class="search_bar_bar" type="text">
            <div class="search_bar_btn"></div>
        </div>
    </div>




    <!-- TODO: Categories -->




    <!-- TODO: FAV RECIPES -->


    <!-- OLD RECIPES LIST -->
    <div id="recipesList">

    </div>

    <h1>All Recipe's</h1>
    <p>This site functions as a recipe archive for me :D</p>

    <div id="searchBar">
        <input type="text" id="searchInput" placeholder="Search for a recipe...">
        <!-- <button id="searchButton">Search</button> -->
    </div>

</body>

<template id="recipeCardTemplate">
    <div class="recipe_card">
        <div class="recipe_card_styling">
            <div class="recipe_card_header">
                <div class="recipe_card_header_symbol">

                </div>
                <div class="recipe_card_header_title recipeTitle"></div>
            </div>

            <div class="recipe_card_info">
                <div class="recipe_card_info_template">
                    <img class="recipe_card_info_template_img" src="img/Clock.png" alt="Clock">
                    <div class="recipe_card_info_template_txt recipeTime">30 min</div>
                </div>

                <div class="recipe_card_info_template">
                    <img class="recipe_card_info_template_img" src="img/Difficulty.png" alt="Difficulty">
                    <div class="recipe_card_info_template_txt recipeSkillLevel">easy</div>
                </div>
            </div>

            <div class="recipe_card_description recipeDescription"></div>
        </div>
        <div class="recipe_card_button">
            <span>View Recipe</span>
        </div>

    </div>
</template>

</html>
